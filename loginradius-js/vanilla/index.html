<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LoginRadius SDK Demo</title>
    <!-- Load the SDK CSS from npm via unpkg (or self-host from node_modules). -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/@loginradius/loginradius-js/dist/LoginRadiusV3.css"
    />
    <style>
      body {
        margin: 0;
        padding: 20px;
        background-color: #f5f5f5;
      }

      .container {
        max-width: 400px;
        margin: 0 auto;

        text-align: center;
      }

      .form-section {
        display: none;
      }
      .form-section.active {
        display: block;
      }
      .toggle-link {
        margin-top: 20px;
        font-size: 14px;
        color: #666;
      }
      .toggle-link a {
        color: #3b82f6;
        text-decoration: none;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>LoginRadius Js SDK</h1>
      <div
        id="my-loader"
        style="
          display: none;
          position: fixed;
          top: 0;
          left: 0;
          width: 100vw;
          height: 100vh;
          background: rgba(255, 255, 255, 0.7);
          z-index: 9999;
          align-items: center;
          justify-content: center;
        "
      >
        <div
          style="
            padding: 24px;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
            font-size: 1.2em;
          "
        >
          Loading...
        </div>
      </div>
      <div class="form-section active" id="login-section">
        <div id="registration-container"></div>
        <!-- <div id="workflow-container"></div> -->
      </div>
      <div class="form-section" id="registration-section">
        <!-- <div id="registration-container"></div> -->''
      </div>
    </div>
    <!-- Load the SDK runtime from npm via unpkg (or self-host from node_modules). -->
    <script src="https://unpkg.com/@loginradius/loginradius-js/dist/LoginRadiusV3.js"></script>
    <script>
      // Call when script is loaded
      if (window.LoginRadiusSDK) {
        var commonOptions = {
          // Replace with values from your LoginRadius app settings.
          apiKey: "YOUR_API_KEY",
          sott: "YOUR_SOTT",
          verificationUrl: "https://your-tenant.example.com/auth.aspx",
          callbackUrl: window.location.origin,
          deleteUrl: window.location.href,
          brandName: "anotherbrand",
          brand: "default",
          verificationEmailTemplate: "trgerfdaswtrgbefrvdsc",
          socialProvidersConfig: {
            google: {
              display: "Sign in with Google",
            },
            github: {
              display: "Continue with GitHub",
            },
            saml_custom_idp: {
              display: "Continue with Custom SAML App",
            },
          },
        };
        var LRObject = new LoginRadiusSDK(commonOptions);

        LRObject.$hooks.call("mapValidationMessages", [
          {
            rule: "required",
            message: "You’ve entered invalid  %s",
          },
        ]);
        LRObject.$hooks.call("mapErrorMessages", [
          {
            code: 938,
            message: "You’ve entered invalid email or password ",
          },
        ]);
        LRObject.init("auth", {
          container: "registration-container",

          hasFooter: false,
          onFooterClick: function () {
            alert("Footer link clicked!");
          },
          onSuccess: function (response) {
            console.log("Registration successful:", response);
            if (response.access_token) {
              window.open("profile.html", "_self");
            }
          },

          onError: function (error) {
            console.error("Registration error:", error);
          },
        });
      } else {
        console.error(
          "LoginRadiusSDK is not defined. Ensure the SDK script is loaded correctly.",
        );
      }
      // Initial form to show
      const params = new URLSearchParams(window.location.search);
      if (params.get("vtype") === "orginvite" && params.get("vtoken")) {
        switchForm("invitation");
      } else {
        switchForm("login");
      }
      function switchForm(formName) {
        console.log(`Switching to ${formName} form`);
        // Hide all sections and show the selected one
        console.log(document.querySelectorAll(".form-section"));

        document
          .querySelectorAll(".form-section")
          .forEach((section) => section.classList.remove("active"));
        document.getElementById(`${formName}-section`).classList.add("active");
      }
    </script>
  </body>
</html>
