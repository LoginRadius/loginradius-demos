services:
  expenses-server:
    env_file:
      - .env
    build:
      context: .
      dockerfile: apps/expenses-server/Dockerfile
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_PATH: /app/data/expense.db
      LR_ISSUER: ${LR_ISSUER}
      LR_SERVICE_ISSUER: ${LR_SERVICE_ISSUER}
      LR_CLIENT_ID: ${LR_CLIENT_ID}
      LR_CLIENT_SECRET: ${LR_CLIENT_SECRET}
      LR_TOKEN_ENDPOINT_AUTH_METHOD: ${LR_TOKEN_ENDPOINT_AUTH_METHOD:-client_secret_post}
      MCP_RESOURCE_URL: ${MCP_RESOURCE_URL}
      REST_RESOURCE_URL: ${REST_RESOURCE_URL}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI}
      # Same-origin behind nginx, so this is not exercised in production —
      # but it must still be a real origin, never "*".
      CORS_ORIGIN: ${CORS_ORIGIN}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  expense-web:
    env_file:
      - .env
    build:
      context: .
      dockerfile: apps/expense-client/Dockerfile
      args:
        # Vite bakes these at BUILD time into the static bundle.
        VITE_LR_AUTHORIZE_URL: ${VITE_LR_AUTHORIZE_URL}
        VITE_LR_CLIENT_ID: ${VITE_LR_CLIENT_ID}
        VITE_LR_REDIRECT_URI: ${VITE_LR_REDIRECT_URI}
        VITE_REST_RESOURCE_URL: ${VITE_REST_RESOURCE_URL}
    expose:
      - "80"
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - expenses-server
      - expense-web
    ports:
      # Single public entrypoint for the domain. Terminate TLS here (add a
      # 443 server block + cert volume) or behind an upstream load balancer.
      - "80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped
